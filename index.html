<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web-KTV-Cast 點歌遙控器</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3059/3059518.png">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-12">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gradient-to-tr from-pink-500 to-indigo-600 rounded-lg flex items-center justify-center shadow">
          <i class="fa-solid fa-microphone text-white text-sm"></i>
        </div>
        <h1 class="text-lg font-bold tracking-wide">Web-KTV-Cast</h1>
      </div>
      <!-- 連線狀態徽章 -->
      <span id="conn-status-badge" class="px-2.5 py-1 text-xs font-bold bg-rose-950 text-rose-400 border border-rose-800 rounded-full flex items-center gap-1.5 transition-all">
        <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span> 未連線
      </span>
    </div>
  </header>

  <!-- 主版面 -->
  <main class="flex-grow max-w-7xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- 左側 / 主區域 (點歌區) -->
    <section class="lg:col-span-7 space-y-6">
      
      <!-- 台灣點歌王 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
        <h2 class="text-base font-bold mb-3 text-pink-400 flex items-center justify-between">
          <span class="flex items-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> 台灣點歌王 伴奏查詢</span>
          <span class="text-[10px] text-slate-500 font-normal">瀏覽找歌無問題 🟢</span>
        </h2>
        
        <div id="iframe-wrapper" class="relative w-full h-[450px] bg-slate-950 rounded-xl overflow-hidden border border-slate-850 mb-3 transition-all duration-300">
          <iframe id="song-iframe" src="https://song.corp.com.tw" class="w-full h-full"></iframe>
        </div>
        
        <div class="flex gap-2">
          <a href="https://song.corp.com.tw" target="_blank" class="flex-1 text-center py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl transition text-xs font-semibold">
            另開點歌王獨立分頁 <i class="fa-solid fa-arrow-up-right-from-square ml-0.5"></i>
          </a>
          <button onclick="toggleTheaterMode()" class="flex-1 py-2.5 bg-indigo-950 hover:bg-indigo-900 border border-indigo-800 text-indigo-300 rounded-xl transition text-xs font-semibold">
            <i class="fa-solid fa-expand"></i> 戲院加大模式
          </button>
        </div>
      </div>

      <!-- 貼歌點歌與語音輔助面板 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
        <h2 class="text-base font-bold text-teal-400 flex items-center gap-2">
          <i class="fa-solid fa-clipboard-list"></i> 快速貼歌 ＋ 語音輔助
        </h2>
        
        <div class="space-y-3">
          <!-- 核心貼歌輸入框 -->
          <div class="relative">
            <input type="text" id="youtube-url-input" class="w-full pl-4 pr-12 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 text-slate-100 placeholder-slate-600 text-sm" placeholder="貼上 YouTube 影片網址、Shorts 或直播連結...">
            <!-- 語音輔助輸入按鈕 -->
            <button id="btn-speech" class="absolute right-3 top-3 text-slate-400 hover:text-pink-500 transition" title="用語音輸入歌名並帶入搜尋">
              <i class="fa-solid fa-microphone text-lg"></i>
            </button>
          </div>

          <!-- 功能點歌控制按鈕 -->
          <div class="grid grid-cols-2 gap-2">
            <button id="btn-manual-add" class="py-3 bg-teal-600 hover:bg-teal-500 text-white rounded-xl font-bold transition text-xs flex items-center justify-center gap-1.5 shadow">
              <i class="fa-solid fa-plus"></i> 自動抓取歌名並點歌
            </button>
            <button id="btn-manual-add-next" class="py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-bold transition text-xs flex items-center justify-center gap-1.5 shadow">
              <i class="fa-solid fa-star"></i> 自動抓取歌名並插播
            </button>
          </div>

          <!-- 一鍵便利工具 -->
          <div class="grid grid-cols-12 gap-2">
            <button id="btn-clipboard-quick" class="col-span-8 py-2.5 bg-slate-800 hover:bg-slate-750 text-slate-200 border border-slate-700 rounded-xl transition text-xs font-semibold flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-paste text-teal-400"></i> 一鍵貼上剪貼簿並點歌
            </button>
            <button id="btn-popup-yt" class="col-span-4 py-2.5 bg-slate-850 hover:bg-slate-800 text-slate-300 font-semibold rounded-xl transition flex items-center justify-center gap-1.5 text-xs border border-slate-750" title="開啟 YouTube 找歌小視窗並複製網址">
              <i class="fa-brands fa-youtube text-base text-rose-500"></i> 彈窗找歌
            </button>
          </div>
        </div>

        <div class="text-[11px] text-slate-400 bg-slate-950/80 p-3.5 rounded-xl border border-slate-850/60 leading-relaxed" id="search-tip-box">
          💡 **超流暢唱歌工作流**：點選 **「彈窗找歌」** 瀏覽，在影片中點選 **「分享 ➡️ 複製連結」**，回到這裡長按輸入框並「貼上」，接著點擊 **「自動抓取歌名並點歌」** 即可。系統會主動線上連線，解析出完整的中文歌名！
        </div>
      </div>

    </section>

    <!-- 右側 / 浮動面板 (已點歌單與控制台) -->
    <section class="lg:col-span-5 space-y-6">

      <!-- 電視連線控制 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
        <h2 class="text-base font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-tv"></i> 電視連線配對
        </h2>
        <div class="flex gap-2">
          <input type="text" id="room-code-input" maxlength="6" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 text-slate-100 text-center tracking-widest font-bold text-lg placeholder-slate-800" placeholder="000000">
          <button id="btn-connect" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition text-sm shrink-0">
            連線電視
          </button>
        </div>
        <p class="text-[11px] text-slate-500">提示：請在電視上開啟播放網頁（tv.html）並輸入螢幕上顯示的 6 位數配對碼。</p>
      </div>

      <!-- KTV 遙控器 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
        <h2 class="text-base font-bold text-pink-400 flex items-center gap-2">
          <i class="fa-solid fa-gamepad"></i> KTV 遙控器面板
        </h2>
        
        <div class="p-3.5 bg-slate-950 rounded-xl border border-slate-850">
          <div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">正在播放</div>
          <div id="ctrl-current-title" class="font-bold text-slate-200 truncate text-sm">目前無歌曲播放中</div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button id="btn-replay" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex flex-col items-center justify-center gap-1 font-semibold text-xs border border-slate-750">
            <i class="fa-solid fa-rotate-left text-lg text-indigo-400"></i> 重唱
          </button>
          <button id="btn-play-pause" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex flex-col items-center justify-center gap-1 font-semibold text-xs border border-slate-750">
            <i class="fa-solid fa-pause text-lg text-pink-400" id="play-pause-icon"></i> <span>暫停</span>
          </button>
          <button id="btn-next" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition flex flex-col items-center justify-center gap-1 font-semibold text-xs border border-slate-750">
            <i class="fa-solid fa-forward text-lg text-emerald-400"></i> 切歌
          </button>
        </div>
      </div>

      <!-- 已點歌單佇列 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-bold text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-list-ol"></i> 點歌佇列
          </h2>
          <span id="queue-count" class="bg-emerald-950 text-emerald-400 px-2.5 py-0.5 text-xs font-bold rounded-full border border-emerald-800/50">0 首</span>
        </div>
        
        <div class="overflow-y-auto max-h-80 pr-1 space-y-2.5" id="controller-queue-list">
          <div class="text-center py-10 text-slate-600 text-xs">歌單目前是空的，快去貼上伴奏吧！</div>
        </div>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
