<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-KTV-Cast 電視播放端</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05070c">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body class="bg-[#05070c] text-slate-100 min-h-screen flex flex-col overflow-hidden select-none">

  <!-- 自動播放權限解鎖遮罩層 -->
  <div id="splash-screen" class="fixed inset-0 bg-[#090d16] z-50 flex flex-col items-center justify-center p-6 text-center">
    <div class="space-y-6 max-w-md">
      <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg animate-pulse">
        <i class="fa-solid fa-microphone-lines text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-indigo-400">Web-KTV-Cast</h1>
      <p class="text-slate-400 text-xs leading-relaxed">歡迎使用家庭點歌系統！因瀏覽器安全限制，需點擊下方按鈕以啟用大螢幕播放與自動聲音播放。</p>
      <button id="btn-activate" class="w-full py-4 bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 text-white font-bold rounded-2xl shadow-xl transition-all duration-300 transform hover:scale-105 text-sm">
        開啟 KTV 電視端播放介面 <i class="fa-solid fa-play ml-1"></i>
      </button>
    </div>
  </div>

  <!-- 電視主畫面（12 欄格網系統） -->
  <div class="flex-grow grid grid-cols-12 h-screen w-screen relative">
    
    <!-- 左側 9 欄：YouTube 播放器容器 -->
    <div id="player-container" class="col-span-9 h-full relative bg-black flex items-center justify-center transition-all duration-500">
      
      <!-- YouTube Player -->
      <div id="tv-player" class="w-full h-full"></div>
      
      <!-- 當前沒有播放時的閒置畫面 -->
      <div id="idle-overlay" class="absolute inset-0 bg-[#07090e]/95 flex flex-col items-center justify-center text-center p-8 space-y-6">
        <div class="text-indigo-400 text-5xl animate-bounce mb-2">
          <i class="fa-solid fa-microphone-lines"></i>
        </div>
        <div class="text-xl font-bold tracking-wider">Web-KTV-Cast 伴唱電視盒</div>
        <div class="space-y-1">
          <div class="text-[10px] text-slate-500 uppercase tracking-widest font-semibold">手機連線配對碼</div>
          <div id="room-code-display" class="text-5xl font-black text-pink-500 tracking-widest bg-slate-900 border border-slate-800 px-6 py-3 rounded-2xl inline-block mt-1">------</div>
        </div>
        <div id="tv-status" class="text-xs text-slate-400 bg-slate-950 px-4 py-2 border border-slate-900 rounded-full flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> 正在連線 Peer 伺服器...
        </div>
        <p class="text-[11px] text-slate-500 max-w-sm leading-relaxed">請在手機點歌遙控端輸入上方的連線配對碼即可連接，隨點隨播！</p>
      </div>

      <!-- 播放中浮動 HUD -->
      <div id="hud-overlay" class="absolute bottom-6 left-6 right-6 bg-black/80 backdrop-blur-md p-4 rounded-2xl border border-slate-800 flex items-center justify-between opacity-0 hover:opacity-100 transition-opacity duration-300 pointer-events-none">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 bg-pink-600 rounded-xl flex items-center justify-center shadow-md">
            <i class="fa-solid fa-music text-white text-sm"></i>
          </div>
          <div>
            <div class="text-[10px] text-slate-400">正在播放歌曲</div>
            <div id="hud-title" class="font-bold text-slate-100 text-base truncate max-w-md">歌曲載入中...</div>
          </div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400">電視房號</div>
          <div id="hud-room" class="font-extrabold text-pink-500 tracking-widest text-base">------</div>
        </div>
      </div>
    </div>

    <!-- 右側 3 欄：即將播放排隊歌單 -->
    <div id="queue-sidebar" class="col-span-3 bg-[#0a0f1d] border-l border-slate-900 h-full flex flex-col transition-all duration-500">
      <div class="p-5 border-b border-slate-900 flex items-center justify-between">
        <h2 class="font-bold text-sm text-pink-500 flex items-center gap-2">
          <i class="fa-solid fa-list-ol"></i> 即將播放
        </h2>
        <button id="btn-toggle-fullscreen" class="text-slate-400 hover:text-white transition p-1.5 rounded-lg hover:bg-slate-800 text-xs" title="切換 滿版/儀表板">
          <i class="fa-solid fa-expand"></i>
        </button>
      </div>
      
      <!-- 演唱資訊卡片 -->
      <div class="p-4 m-4 bg-[#0e162a] rounded-xl border border-slate-800/60">
        <div class="text-[10px] text-slate-500 font-semibold mb-1">正在演唱</div>
        <div id="current-song-title" class="text-xs font-bold text-slate-200 truncate">目前無歌曲播放</div>
      </div>
      
      <!-- 列表排隊 -->
      <div class="flex-grow p-4 overflow-y-auto">
        <ul id="tv-queue-list" class="space-y-2.5">
          <li class="text-slate-600 text-xs text-center py-12">等待手機連線點歌中...</li>
        </ul>
      </div>
      
      <div class="p-4 border-t border-slate-900 bg-slate-950 text-center text-[10px] text-slate-600 font-medium">
        Web-KTV-Cast 家庭點歌系統
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
